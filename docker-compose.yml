services:
  card-sim:
    build:
      context: .
      dockerfile: card-sim/Dockerfile
    container_name: card-sim
    ports:
      - "9090:9090"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/sim/config || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: adapter-gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_UPSTREAM_HOST: card-sim
    depends_on:
      card-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: gateway-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboard.json:/var/lib/grafana/dashboards/gateway.json
    depends_on:
      - prometheus

  loadgen:
    build:
      context: .
      dockerfile: loadgen/Dockerfile
    container_name: loadgen
    ports:
      - "8082:8082"
    environment:
      LOADGEN_GATEWAYURL: http://gateway:8080
      LOADGEN_CARDSIMURL: http://card-sim:8081
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/api/status || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
